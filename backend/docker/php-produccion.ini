; ===== Ajustes de PHP para producción =====

; Errores: nunca mostrarlos al usuario, sí registrarlos en los logs.
display_errors = Off
display_startup_errors = Off
log_errors = On

; No anunciar la versión de PHP en las respuestas.
expose_php = Off

; Zona horaria de Bolivia.
date.timezone = America/La_Paz

; Cookie de sesión más segura.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
; Activar solo cuando el sistema funcione con HTTPS:
; session.cookie_secure = 1

; Cargar las variables de entorno en $_ENV.
; php.ini-production usa "GPCS" (sin la E), y database.php lee $_ENV.
variables_order = "EGPCS"