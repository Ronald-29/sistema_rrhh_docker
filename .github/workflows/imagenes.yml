name: Construir y publicar imagenes

on:
  push:
    branches: [main]

jobs:
  publicar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Entrar al registro
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar el backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: produccion
          push: true
          tags: |
            ronal29/archivo-backend:${{ github.sha }}
            ronal29/archivo-backend:latest

      - name: Construir y publicar el web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ronal29/archivo-web:${{ github.sha }}
            ronal29/archivo-web:latest
