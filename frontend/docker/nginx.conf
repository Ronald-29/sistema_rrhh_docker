server {
    # Nginx escucha en el puerto 80 dentro del contenedor.
    listen 80;
    server_name _;

    # Carpeta con los archivos compilados del frontend.
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de Nginx.
    server_tokens off;

    # 1. La API: se pasa a PHP-FPM en el contenedor del backend.
    location /api/ {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # 2. Los archivos compilados por Vite: caché larga en el navegador.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 3. Todo lo demás: el archivo si existe; si no, index.html (Vue decide).
    location / {
        try_files $uri $uri/ /index.html;
    }
}